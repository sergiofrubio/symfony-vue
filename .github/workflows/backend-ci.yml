name: Backend CI

# CI para el backend Symfony (PHP). Ajusta la versión de PHP y los comandos según tu proyecto.
on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v4
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, xml, intl, zip
          ini-values: post_max_size=256M, memory_limit=2G

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run static analysis (optional)
        run: composer phpstan --no-interaction || echo "phpstan not configured"

      - name: Run tests
        run: |
          if composer test --no-interaction; then
            echo "Tests run via composer script"
          elif [ -f vendor/bin/phpunit ]; then
            vendor/bin/phpunit --colors=always
          else
            echo "No test command found; configure a test script or add phpunit"
            exit 0
          fi
