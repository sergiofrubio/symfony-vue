
services:
  # --- Backend PHP-FPM ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      DATABASE_URL: mysql://symfony:symfony@db:3306/symfony
      REDIS_URL: redis://redis:6379
    depends_on:
      - db
      - redis

  # --- Nginx para Symfony API ---
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      - backend

  # --- Frontend Vue (build estático) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
    container_name: vue_frontend
    ports:
      - "3000:80"

  # --- Base de datos MySQL ---
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: symfony
      MYSQL_USER: symfony
      MYSQL_PASSWORD: symfony
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # --- Redis ---
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  db_data:
  redis_data:
